<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Electronics - Register</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="container">
        <a href="index.html" class="logo">OnlineShopping</a>

        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="#products">Products</a>
          <a href="login.html">Login</a>
          <!-- <a href="register.html">Sign Up</a> -->
          <a href="cart.html">
            <i class="fa-solid fa-cart-shopping"></i> Cart (<span
              id="cart-count"
              >0</span
            >)
          </a>
        </nav>
      </div>
    </header>

    <div class="card" style="width: 100%; margin: auto; max-width: 400px">
      <h2 class="text-center" style="margin-bottom: var(--spacing-lg)">
        Create Account
      </h2>

      <form action="php/register.php" method="POST">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            class="form-control"
            required
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            required
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            required
          />
        </div>
        <button
          type="submit"
          class="btn btn-primary w-100"
          style="margin-top: var(--spacing-md)"
        >
          Sign Up
        </button>
      </form>

      <div class="text-center" style="margin-top: var(--spacing-md)">
        <p style="font-size: 0.875rem">
          Already have an account? <a href="login.html">Login</a>
        </p>
      </div>
    </div>
  </body>
</html>
