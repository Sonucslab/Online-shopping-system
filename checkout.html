<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus | Checkout</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation (Minimal for checkout) -->
  <nav class="navbar" style="border-bottom: 1px solid var(--surface-border);">
    <div class="container flex justify-center">
      <a href="index.html" class="logo">NEXUS<span>.</span> Secure Checkout</a>
    </div>
  </nav>

  <main class="container" style="padding-top: var(--spacing-lg); max-width: 900px;">
    
    <div class="grid" style="grid-template-columns: 3fr 2fr; gap: var(--spacing-lg);">
      <!-- Checkout Form -->
      <div>
        <h2 style="margin-bottom: var(--spacing-md);">Shipping & Payment</h2>
        <form id="checkout-form" class="glass-card flex-col gap-md" action="php/place-order.php" method="POST">
          
          <h3 style="font-size: 1.125rem; color: var(--primary-color);">Shipping Details</h3>
          <div class="grid grid-cols-2 gap-md">
            <div class="form-group" style="margin: 0;">
              <label class="form-label">First Name</label>
              <input type="text" class="form-input" required>
            </div>
            <div class="form-group" style="margin: 0;">
              <label class="form-label">Last Name</label>
              <input type="text" class="form-input" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Address</label>
            <input type="text" class="form-input" required>
          </div>
          <div class="grid grid-cols-3 gap-md">
            <div class="form-group" style="grid-column: span 2; margin: 0;">
              <label class="form-label">City</label>
              <input type="text" class="form-input" required>
            </div>
            <div class="form-group" style="margin: 0;">
              <label class="form-label">Zip Code</label>
              <input type="text" class="form-input" required>
            </div>
          </div>

          <hr style="border: none; border-top: 1px solid var(--surface-border); margin: var(--spacing-sm) 0;">
          
          <h3 style="font-size: 1.125rem; color: var(--primary-color);">Payment Details</h3>
          <div class="form-group">
            <label class="form-label">Card Number</label>
            <input type="text" class="form-input" placeholder="0000 0000 0000 0000" required>
          </div>
          <div class="grid grid-cols-2 gap-md">
            <div class="form-group" style="margin: 0;">
              <label class="form-label">Expiry (MM/YY)</label>
              <input type="text" class="form-input" placeholder="MM/YY" required>
            </div>
            <div class="form-group" style="margin: 0;">
              <label class="form-label">CVC</label>
              <input type="text" class="form-input" placeholder="123" required>
            </div>
          </div>
          
          <button type="submit" class="btn btn-primary" style="margin-top: var(--spacing-md); font-size: 1.125rem;">Place Order</button>
        </form>
      </div>

      <!-- Order Summary Sidebar -->
      <div>
        <h2 style="margin-bottom: var(--spacing-md);">Your Order</h2>
        <div class="glass-card flex-col" style="height: fit-content; position: sticky; top: 100px;">
          <div id="checkout-items-list" class="flex-col gap-sm" style="margin-bottom: var(--spacing-md); border-bottom: 1px solid var(--surface-border); padding-bottom: var(--spacing-md);">
            <!-- JS populates checkout items -->
          </div>
          
          <div class="flex justify-between" style="margin-bottom: var(--spacing-sm);">
            <span style="color: var(--text-muted);">Subtotal</span>
            <span id="checkout-subtotal">$0.00</span>
          </div>
          <div class="flex justify-between" style="margin-bottom: var(--spacing-sm);">
            <span style="color: var(--text-muted);">Tax (8%)</span>
            <span id="checkout-tax">$0.00</span>
          </div>
          <div class="flex justify-between" style="margin-bottom: var(--spacing-sm); border-top: 1px solid var(--surface-border); padding-top: var(--spacing-sm);">
            <strong>Total</strong>
            <strong id="checkout-total" style="color: var(--primary-color); font-size: 1.25rem;">$0.00</strong>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/cart.js"></script>
  <script>
    document.getElementById('checkout-form').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Order Placed Successfully! (Database integration pending)');
      localStorage.removeItem('nexus_cart');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
