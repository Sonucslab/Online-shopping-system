<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Electronics - Checkout</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="container text-center">
        <a href="index.html" class="logo">OnlineShopping</a>
      </div>
    </header>

    <main class="container checkout-container" style="max-width: 900px">
      <div
        class="grid"
        style="grid-template-columns: 2fr 1fr; gap: var(--spacing-lg)"
      >
        <!-- Checkout Form -->
        <div class="card">
          <h2
            style="
              margin-bottom: var(--spacing-md);
              border-bottom: 1px solid var(--border-color);
              padding-bottom: 0.5rem;
            "
          >
            Billing Details
          </h2>
          <form id="checkout-form" action="php/order.php" method="POST">
            <div class="grid grid-cols-2 gap-md">
              <div class="form-group">
                <label class="form-label">First Name</label>
                <input
                  type="text"
                  name="first_name"
                  class="form-control"
                  required
                />
              </div>
              <div class="form-group">
                <label class="form-label">Last Name</label>
                <input
                  type="text"
                  name="last_name"
                  class="form-control"
                  required
                />
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Address</label>
              <input type="text" name="address" class="form-control" required />
            </div>
            <div class="grid grid-cols-2 gap-md">
              <div class="form-group">
                <label class="form-label">City</label>
                <input type="text" name="city" class="form-control" required />
              </div>
              <div class="form-group">
                <label class="form-label">Zip Code</label>
                <input
                  type="text"
                  name="zip_code"
                  class="form-control"
                  required
                />
              </div>
            </div>

            <h3
              style="
                margin: 1.5rem 0 1rem 0;
                border-bottom: 1px solid var(--border-color);
                padding-bottom: 0.5rem;
              "
            >
              Payment Method
            </h3>
            <div class="form-group">
              <label class="form-label">Card Number</label>
              <input
                type="text"
                class="form-control"
                placeholder="0000 0000 0000 0000"
                required
              />
            </div>
            <div class="grid grid-cols-2 gap-md">
              <div class="form-group">
                <label class="form-label">Expiry</label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="MM/YY"
                  required
                />
              </div>
              <div class="form-group">
                <label class="form-label">CVC</label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="123"
                  required
                />
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-4">
              Place Order
            </button>
          </form>
        </div>

        <!-- Order Summary -->
        <div class="card" style="height: fit-content">
          <h3
            style="
              border-bottom: 1px solid var(--border-color);
              padding-bottom: 0.5rem;
              margin-bottom: 1rem;
            "
          >
            Order Summary
          </h3>

          <div
            id="checkout-items-list"
            class="flex-col gap-sm"
            style="
              margin-bottom: 1rem;
              padding-bottom: 1rem;
              border-bottom: 1px solid var(--border-color);
            "
          >
            <!-- JS populates -->
          </div>

          <div class="flex justify-between" style="margin-bottom: 0.5rem">
            <span>Subtotal</span>
            <span id="checkout-subtotal">$0.00</span>
          </div>
          <div class="flex justify-between" style="margin-bottom: 0.5rem">
            <span>Tax</span>
            <span id="checkout-tax">$0.00</span>
          </div>
          <div
            class="flex justify-between"
            style="
              margin-bottom: 1rem;
              padding-top: 0.5rem;
              border-top: 1px solid var(--border-color);
            "
          >
            <strong>Total</strong>
            <strong id="checkout-total" style="font-size: 1.25rem"
              >$0.00</strong
            >
          </div>
        </div>
      </div>
    </main>

    <footer>
      <div class="container text-center">
        <p>&copy; 2026 Nexus Electronics.</p>
      </div>
    </footer>

    <script src="js/cart.js"></script>
    <script>
      document
        .getElementById("checkout-form")
        .addEventListener("submit", (e) => {
          e.preventDefault();
          alert("Order placed successfully (Demo)!");
          localStorage.removeItem("nexus_cart");
          window.location.href = "index.html";
        });
    </script>
  </body>
</html>
