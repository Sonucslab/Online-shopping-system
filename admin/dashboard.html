<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Admin | Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body style="display: flex; height: 100vh; overflow: hidden; background-color: var(--bg-color);">

  <!-- Sidebar -->
  <aside style="width: 250px; background: rgba(15, 23, 42, 0.9); border-right: 1px solid var(--surface-border); display: flex; flex-direction: column; padding: var(--spacing-md);">
    <a href="../index.html" class="logo" style="margin-bottom: var(--spacing-xl); text-align: center;">NEXUS<span>.</span> Admin</a>
    
    <nav class="flex-col gap-sm" style="flex-grow: 1;">
      <a href="dashboard.html" class="btn" style="justify-content: flex-start; background: var(--surface-color); color: var(--primary-color);">
        <i class="fa-solid fa-chart-pie" style="width: 24px;"></i> Dashboard
      </a>
      <a href="orders.html" class="btn btn-secondary" style="justify-content: flex-start; border: none; opacity: 0.7;">
        <i class="fa-solid fa-box" style="width: 24px;"></i> Orders
      </a>
      <a href="add-product.html" class="btn btn-secondary" style="justify-content: flex-start; border: none; opacity: 0.7;">
        <i class="fa-solid fa-plus" style="width: 24px;"></i> Add Product
      </a>
    </nav>

    <a href="../login.html" class="btn btn-secondary" style="justify-content: flex-start; border: none; color: var(--accent-color);">
      <i class="fa-solid fa-arrow-right-from-bracket" style="width: 24px;"></i> Logout
    </a>
  </aside>

  <!-- Main Content -->
  <main style="flex-grow: 1; padding: var(--spacing-lg); overflow-y: auto;">
    <header class="flex justify-between items-center" style="margin-bottom: var(--spacing-lg);">
      <h2>Dashboard Overview</h2>
      <div class="flex items-center gap-sm">
        <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--primary-color); display: flex; align-items: center; justify-content: center; font-weight: bold;">A</div>
        <span>Admin User</span>
      </div>
    </header>

    <!-- Stats Row -->
    <div class="grid grid-cols-4 gap-md" style="margin-bottom: var(--spacing-lg);">
      <div class="glass-card" style="padding: var(--spacing-md);">
        <h4 style="color: var(--text-muted); margin-bottom: var(--spacing-sm);">Total Sales</h4>
        <div style="font-size: 2rem; font-weight: 700;">$24,599</div>
      </div>
      <div class="glass-card" style="padding: var(--spacing-md);">
        <h4 style="color: var(--text-muted); margin-bottom: var(--spacing-sm);">Orders</h4>
        <div style="font-size: 2rem; font-weight: 700;">142</div>
      </div>
      <div class="glass-card" style="padding: var(--spacing-md);">
        <h4 style="color: var(--text-muted); margin-bottom: var(--spacing-sm);">Products</h4>
        <div style="font-size: 2rem; font-weight: 700;">56</div>
      </div>
      <div class="glass-card" style="padding: var(--spacing-md);">
        <h4 style="color: var(--text-muted); margin-bottom: var(--spacing-sm);">Customers</h4>
        <div style="font-size: 2rem; font-weight: 700;">89</div>
      </div>
    </div>

    <!-- Recent Orders Table -->
    <div class="glass-card">
      <h3 style="margin-bottom: var(--spacing-md); border-bottom: 1px solid var(--surface-border); padding-bottom: var(--spacing-sm);">Recent Orders</h3>
      <table style="width: 100%; border-collapse: collapse; text-align: left;">
        <thead>
          <tr style="color: var(--text-muted);">
            <th style="padding: var(--spacing-sm); border-bottom: 1px solid var(--surface-border);">Order ID</th>
            <th style="padding: var(--spacing-sm); border-bottom: 1px solid var(--surface-border);">Customer</th>
            <th style="padding: var(--spacing-sm); border-bottom: 1px solid var(--surface-border);">Date</th>
            <th style="padding: var(--spacing-sm); border-bottom: 1px solid var(--surface-border);">Status</th>
            <th style="padding: var(--spacing-sm); border-bottom: 1px solid var(--surface-border);">Total</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td style="padding: var(--spacing-sm); border-bottom: 1px solid rgba(255,255,255,0.05);">#ORD-001</td>
            <td style="padding: var(--spacing-sm); border-bottom: 1px solid rgba(255,255,255,0.05);">John Doe</td>
            <td style="padding: var(--spacing-sm); border-bottom: 1px solid rgba(255,255,255,0.05);">2026-08-17</td>
            <td style="padding: var(--spacing-sm); border-bottom: 1px solid rgba(255,255,255,0.05);"><span style="background: rgba(59, 130, 246, 0.2); color: var(--primary-color); padding: 2px 8px; border-radius: 12px; font-size: 0.8rem;">Processing</span></td>
            <td style="padding: var(--spacing-sm); border-bottom: 1px solid rgba(255,255,255,0.05);">$1,299.00</td>
          </tr>
          <tr>
            <td style="padding: var(--spacing-sm); border-bottom: 1px solid rgba(255,255,255,0.05);">#ORD-002</td>
            <td style="padding: var(--spacing-sm); border-bottom: 1px solid rgba(255,255,255,0.05);">Jane Smith</td>
            <td style="padding: var(--spacing-sm); border-bottom: 1px solid rgba(255,255,255,0.05);">2026-08-16</td>
            <td style="padding: var(--spacing-sm); border-bottom: 1px solid rgba(255,255,255,0.05);"><span style="background: rgba(16, 185, 129, 0.2); color: #10b981; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem;">Shipped</span></td>
            <td style="padding: var(--spacing-sm); border-bottom: 1px solid rgba(255,255,255,0.05);">$199.00</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

  <script src="../js/admin.js"></script>
</body>
</html>
