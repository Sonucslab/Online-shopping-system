<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Nexus Electronics</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:#f3f4f6; font-family:'Inter',sans-serif; }
    .login-card { background:#fff; padding:2.5rem; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.08); width:100%; max-width:400px; }
    .login-card h2 { text-align:center; margin-bottom:1.5rem; color:#111827; }
    .login-card .logo-icon { width:48px; height:48px; background:#2563eb; border-radius:10px; display:flex; align-items:center; justify-content:center; margin:0 auto 1rem; color:#fff; font-size:20px; font-weight:800; }
    .error-msg { background:#fef2f2; color:#dc2626; padding:10px 14px; border-radius:6px; font-size:13px; margin-bottom:1rem; border:1px solid #fecaca; }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo-icon">N</div>
    <h2>Admin Login</h2>

    <div id="error-box" class="error-msg" style="display:none;"></div>

    <form action="../php/login.php" method="POST">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input type="email" id="email" name="email" class="form-control" required placeholder="admin@nexus.com">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" required placeholder="Enter password">
      </div>
      <button type="submit" class="btn btn-primary w-100" style="margin-top:1rem;padding:12px;font-size:15px;">Sign In</button>
    </form>

    <div class="text-center" style="margin-top:1rem;">
      <p style="font-size:13px;color:#6b7280;">
        <a href="../login.html" style="color:#2563eb;">← Back to Customer Login</a>
      </p>
    </div>
  </div>

  <script>
    // Show error if redirected with ?error=
    const params = new URLSearchParams(window.location.search);
    if (params.get('error')) {
      const box = document.getElementById('error-box');
      box.textContent = params.get('error');
      box.style.display = 'block';
    }
  </script>

</body>
</html>
